[package]
name = "pokemmo-tools-desktop"
version = "0.1.0"
description = "PokeKit — Windows desktop shell"
authors = ["TyrAntitar"]
edition = "2021"
rust-version = "1.77"

# Phase 2 is a thin shell: it loads the exact same React build the website
# ships (../dist) and changes no features. The capture/OCR module (Phase 3)
# adds Windows-only dependencies and Tauri commands on top of this.

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
tauri-plugin-single-instance = "2"

# Windows-only: WinRT OCR (Windows.Media.Ocr) + Win32 window capture (GDI).
# Pinned to a known-good windows-rs; if you bump it, a few signatures
# (HWND repr, PRINT_WINDOW_FLAGS, OcrEngine factory) may need minor tweaks.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Foundation",
  "Foundation_Collections",
  "Globalization",
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
